<svg xmlns="http://www.w3.org/2000/svg" width="930" height="690" viewBox="0 0 930 690" role="img" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>spec-to-code agent on AWS Bedrock AgentCore Runtime</title>
  <desc>A developer invokes the deployed agent with SigV4. Inside an AgentCore Runtime microVM, BedrockAgentCoreApp serves the contract routes, main.py's entrypoint runs a Strands agent loop that calls Amazon Bedrock Nova Pro for inference and executes file_write and run_pytest locally in the container. Code and dependencies are mounted read-only at /var/task, generated code lands in an ephemeral /tmp/sandbox, and traces flow to CloudWatch.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="930" height="690" fill="#ffffff"/>

  <!-- AWS boundary -->
  <rect x="270" y="40" width="620" height="600" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="292" y="66" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">AWS · us-east-1</text>

  <!-- microVM boundary -->
  <rect x="300" y="90" width="560" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="320" y="114" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">AgentCore Runtime · microVM</text>

  <!-- client -->
  <rect x="40" y="240" width="190" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="135" y="277" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">Developer</text>

  <rect x="40" y="340" width="190" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="372" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">agentcore invoke</text>
  <text x="135" y="394" font-size="12.5" fill="#475569" text-anchor="middle">or boto3 · SigV4</text>

  <!-- runtime stack -->
  <rect x="325" y="135" width="280" height="64" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="465" y="164" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">BedrockAgentCoreApp</text>
  <text x="465" y="186" font-size="12.5" fill="#475569" text-anchor="middle">/invocations + /ping</text>

  <rect x="325" y="225" width="280" height="64" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="465" y="254" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">main.py @app.entrypoint</text>
  <text x="465" y="276" font-size="12.5" fill="#475569" text-anchor="middle">limits turns = 4</text>

  <rect x="325" y="315" width="280" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="465" y="344" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">Strands agent loop</text>
  <text x="465" y="366" font-size="12.5" fill="#475569" text-anchor="middle">create_agent() per request</text>

  <rect x="325" y="405" width="134" height="60" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
  <text x="392" y="434" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">file_write</text>
  <text x="392" y="453" font-size="12.5" fill="#475569" text-anchor="middle">built-in tool</text>

  <rect x="471" y="405" width="134" height="60" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
  <text x="538" y="434" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">run_pytest</text>
  <text x="538" y="453" font-size="12.5" fill="#475569" text-anchor="middle">custom @tool</text>

  <!-- container filesystem -->
  <rect x="640" y="180" width="200" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="740" y="212" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">/var/task</text>
  <text x="740" y="234" font-size="12.5" fill="#475569" text-anchor="middle">read-only · code + deps</text>

  <rect x="640" y="330" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="740" y="362" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">/tmp/sandbox</text>
  <text x="740" y="384" font-size="12.5" fill="#475569" text-anchor="middle">ephemeral · per session</text>

  <!-- regional services -->
  <rect x="330" y="530" width="240" height="84" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="562" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">Amazon Bedrock</text>
  <text x="450" y="584" font-size="12.5" fill="#475569" text-anchor="middle">Nova Pro · ConverseStream</text>
  <text x="450" y="603" font-size="12.5" fill="#475569" text-anchor="middle">via execution role</text>

  <rect x="620" y="530" width="240" height="84" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="740" y="568" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">CloudWatch</text>
  <text x="740" y="590" font-size="12.5" fill="#475569" text-anchor="middle">logs · OTLP traces</text>

  <!-- edges -->
  <g stroke="#64748b" stroke-width="1.4" fill="none">
    <path d="M135 304 V336" marker-end="url(#a)"/>
    <path d="M230 380 H250 V167 H321" marker-end="url(#a)"/>
    <path d="M465 379 V392 H392 V401" marker-end="url(#a)"/>
    <path d="M465 379 V392 H538 V401" marker-end="url(#a)"/>
    <path d="M350 379 V395 H310 V556 H326" marker-end="url(#a)"/>
    <path d="M605 435 H622 V370 H636" marker-end="url(#a)"/>
    <path d="M392 465 V478 H700 V414" marker-end="url(#a)"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <path d="M636 215 H628 V175 H619" marker-end="url(#a)"/>
    <path d="M740 492 V526" marker-end="url(#a)"/>
  </g>
</svg>
